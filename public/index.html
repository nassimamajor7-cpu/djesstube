<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DjessTube — regarde, écoute, télécharge</title>
<meta name="description" content="DjessTube : cherche des vidéos, regarde-les, garde tes favoris et télécharge en MP3 ou MP4.">
<meta name="theme-color" content="#0a0713">

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

    <a href="#/explore" data-nav="explore"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span>Explorer</span></a>
    <a href="#/library" data-nav="library"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg><span>Bibliothèque</span></a>

  </nav>
  <div class="side-foot">
    <button class="side-btn" id="btnSettings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Paramètres</span></button>

  </div>
</aside>

<div class="shell">
  <header class="top">
    <a class="logo logo-m" href="#/"><span class="logo-mark"></span></a>
    <form id="searchForm" class="search" autocomplete="off">
      <svg class="s-ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="text" inputmode="search" enterkeyhint="search" placeholder="Rechercher ou coller un lien…" aria-label="Recherche">
      <button type="button" id="btnPaste" class="s-paste" title="Coller un lien du presse-papiers" aria-label="Coller un lien"><svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg></button>
      <button class="s-go" aria-label="Rechercher">Go</button>
      <div id="sugg" class="sugg" hidden></div>
    </form>
    <button class="icon-btn" id="btnTheme" title="Changer de thème" aria-label="Thème"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabbar" id="tabbar">
  <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Accueil</span></a>
  <a href="#/explore" data-nav="explore"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span>Explorer</span></a>
  <a href="#/library" data-nav="library"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg><span>Biblio</span></a>
  <a href="#/downloads" data-nav="downloads"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 20h16"/></svg><span>Télé.</span></a>
  <button id="btnSettingsM"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>Réglages</span></button>
</nav>

<div id="pbox" class="pbox hidden">
  <div id="ytp"></div>
  <video id="dv" controls playsinline hidden></video>
  <div class="mini-bar">
    <span id="miniTitle"></span>
    <button id="miniPlay" aria-label="Lecture / pause"></button>
    <button id="miniOpen" aria-label="Agrandir"><svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
    <button id="miniClose" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal" class="modal" hidden></div>

<script src="/js/app.js"></script>
</body>
</html>
